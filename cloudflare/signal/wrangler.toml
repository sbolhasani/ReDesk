name = "redesk-signal"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# The initial single coordinator is intentional for protocol validation.
# Durable Objects with SQLite storage work on the Cloudflare Workers Free plan.
[[durable_objects.bindings]]
name = "SIGNAL_HUB"
class_name = "SignalHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalHub"]

[observability]
enabled = true
